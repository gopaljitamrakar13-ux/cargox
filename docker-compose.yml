version: '3.8'

# =====================================================
# CargoX — LOCAL DEVELOPMENT ONLY
# =====================================================
# This docker-compose is for local development.
# Production uses an EXTERNAL PostgreSQL database
# (e.g. Supabase, Neon, or self-hosted) managed via pgAdmin.
#
# DO NOT use this file for production deployment.
# Production backend runs on Render Web Service.
# =====================================================

services:
  backend:
    build: ./backend
    container_name: cargox_backend
    restart: on-failure
    env_file:
      - ./backend/.env
    environment:
      # Override to use the local PostgreSQL below (dev only)
      # For production, set DATABASE_URL in Render environment variables.
      DATABASE_URL: ${DATABASE_URL}
      SECRET_KEY: ${SECRET_KEY:-dev-secret-key}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-dev-jwt-key}
      FRONTEND_URL: http://localhost:3000
      FLASK_ENV: development
      FLASK_DEBUG: "True"
      PORT: "5000"
    ports:
      - "5000:5000"
    volumes:
      - ./backend:/app
    command: >
      sh -c "flask db upgrade && python run.py"

  frontend:
    build: ./frontend
    container_name: cargox_frontend
    restart: on-failure
    ports:
      - "3000:80"
    depends_on:
      - backend
    environment:
      VITE_API_URL: http://localhost:5000/api
      VITE_SOCKET_URL: http://localhost:5000

volumes: {}
