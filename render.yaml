services:
  # ==============================
  # CargoX Backend - Flask
  # ==============================
  - type: web
    name: cargox-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --worker-class eventlet --workers 1 --bind 0.0.0.0:$PORT run:app
    healthCheckPath: /health

    envVars:
      - key: PYTHON_VERSION
        value: "3.11.0"

      - key: FLASK_ENV
        value: production

      - key: FLASK_DEBUG
        value: "False"

      - key: DATABASE_URL
        sync: false

      - key: SECRET_KEY
        generateValue: true

      - key: JWT_SECRET_KEY
        generateValue: true

      - key: FRONTEND_URL
        sync: false

      - key: FIREBASE_CREDENTIALS
        value: ""


  # ==============================
  # CargoX Frontend - React/Vite
  # ==============================
  - type: web
    name: cargox-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist

    routes:
      - type: rewrite
        source: "/*"
        destination: /index.html

    headers:
      - path: "/*"
        name: Cache-Control
        value: no-cache

    envVars:
      - key: VITE_API_URL
        sync: false

      - key: VITE_SOCKET_URL
        sync: false